<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="../estilos/principal.css">
  <style>
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f3f4f6; }
    .card { background: #fff; padding: 1.5rem; border-radius: 8px; width: 320px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    .card h1 { margin: 0 0 1rem; font-size: 1.4rem; }
    .field { margin-bottom: 0.75rem; display: flex; flex-direction: column; }
    .field label { font-weight: 600; margin-bottom: 0.35rem; }
    .field input { padding: 0.6rem 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; }
    button { width: 100%; padding: 0.7rem; border: none; border-radius: 6px; background: #2563eb; color: #fff; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { color: #b91c1c; margin-top: 0.5rem; }
    .success { color: #15803d; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Iniciar sesión</h1>
    <form id="login-form">
      <div class="field">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" id="submit">Entrar</button>
      <div id="message"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const messageEl = document.getElementById('message');
    const button = document.getElementById('submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageEl.textContent = '';
      messageEl.className = '';
      button.disabled = true;
      button.textContent = 'Ingresando...';

      try {
        const res = await fetch('../../api/login.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: form.username.value.trim(),
            password: form.password.value.trim(),
          }),
        });

        const data = await res.json();
        if (!res.ok || data.status !== 'ok') {
          throw new Error(data.message || 'Error de autenticación');
        }

        messageEl.textContent = 'Login correcto, redirigiendo...';
        messageEl.className = 'success';

        // Redirige según el rol devuelto; ajusta las rutas de paneles.
        const rol = data.user?.rol || 'usuario';
        const destinos = {
          administrador: '../paginas/administrador/index.html',
          bibliotecario: '../paginas/bibliotecario/index.html',
          usuario: '../paginas/usuario/index.html',
        };
        setTimeout(() => {
          window.location.href = destinos[rol] || destinos.usuario;
        }, 800);
      } catch (err) {
        messageEl.textContent = err.message;
        messageEl.className = 'error';
      } finally {
        button.disabled = false;
        button.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
